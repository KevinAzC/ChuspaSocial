name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, main]

jobs:
  validar-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar descripción del PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "El PR debe tener descripción"
            exit 1
          fi
          echo "✅ PR tiene descripción"

      - name: Verificar que referencia un issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s\n' "$PR_BODY" | grep -Eqi '(closes|fixes|resolves) #[0-9]+'; then
            echo "El PR debe referenciar un issue con 'Closes #N'"
            exit 1
          fi
          echo "✅ PR referencia un issue"

      - name: Verificar título del PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          REGEX="^(feat|fix|docs|test|chore|refactor|security|data)(\(.*\))?!?: .+"
          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "❌ ERROR: El título del PR no cumple con las convenciones del proyecto."
            exit 1
          fi
          echo "✅ PR tiene un título válido"

      - name: Instalar moodle-plugin-ci
        run: |
          composer global config policy.advisories.block false
          composer global require moodlehq/moodle-plugin-ci
          echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH

      - name: Ejecutar codechecker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci codechecker

      - name: Ejecutar phpunit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit src
        
      - name: Verificar nombre de la rama del PR
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          REGEX="^(feat|fix|docs|test|chore|refactor|security|data)/[a-z0-9._-]+$"
          if [[ ! "$HEAD_REF" =~ $REGEX ]]; then
            echo "❌ ERROR: El nombre de la rama no cumple con las convenciones."
            exit 1
          fi
          echo "✅ Rama tiene un nombre válido: $HEAD_REF"

      - name: Verificar que los PR de trabajo apunten a dev
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "❌ ERROR: Los PR de trabajo deben apuntar a 'dev'."
            exit 1
          fi
          echo "✅ PR apunta a '$BASE_REF' (correcto)"

      - name: Verificar que el PR modifique un solo archivo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          COUNT=$(printf '%s\n' "$FILES" | grep -c .)

          if [ "$COUNT" -le 1 ]; then
            echo "✅ El PR modifica $COUNT archivo(s)"
            exit 0
          fi

          # Excepción: amd/src + amd/build o version.php + ci.yml
          if [ "$COUNT" -eq 2 ]; then
            SRC=$(printf '%s\n' "$FILES" | grep -E '^src/amd/src/.+\.js$' || true)
            BUILD=$(printf '%s\n' "$FILES" | grep -E '^src/amd/build/.+\.min\.js$' || true)
            WORKFLOW=$(printf '%s\n' "$FILES" | grep -E '^\.github/workflows/ci\.yml$' || true)
            VERSION=$(printf '%s\n' "$FILES" | grep -E '^src/version\.php$' || true)
            if ([ -n "$SRC" ] && [ -n "$BUILD" ]) || ([ -n "$WORKFLOW" ] && [ -n "$VERSION" ]); then
              echo "✅ Excepción permitida de 2 archivos"
              exit 0
            fi
          fi

          echo "❌ ERROR: Este PR modifica $COUNT archivos."
          exit 1 