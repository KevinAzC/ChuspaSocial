name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [dev, main]

jobs:
  validar-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar descripción del PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "El PR debe tener descripción"
            exit 1
          fi
          echo "✅ PR tiene descripción"

      - name: Verificar que referencia un issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! printf '%s\n' "$PR_BODY" | grep -Eqi '(closes|fixes|resolves) #[0-9]+'; then
            echo "El PR debe referenciar un issue con 'Closes #N'"
            exit 1
          fi
          echo "✅ PR referencia un issue"

      - name: Verificar título del PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          REGEX="^(feat|fix|docs|test|chore|refactor|security|data)(\(.*\))?!?: .+"
          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "❌ ERROR: El título del PR no cumple con las convenciones del proyecto."
            echo ""
            echo "El título debe comenzar con uno de los prefijos permitidos (seguido de ':' y espacio):"
            echo "  - feat:      (nueva funcionalidad)"
            echo "  - fix:       (corrección de error)"
            echo "  - docs:      (documentación)"
            echo "  - test:      (pruebas)"
            echo "  - chore:     (configuración o tareas de mantenimiento)"
            echo "  - refactor:  (mejora de código sin cambio funcional)"
            echo "  - security:  (seguridad)"
            echo "  - data:      (análisis de datos)"
            echo ""
            echo "Ejemplo válido: chore(ci): agregar validacion de titulo de PR (#370)"
            echo "Título recibido: '$PR_TITLE'"
            exit 1
          fi
          echo "✅ PR tiene un título válido"

      - name: Instalar moodle-plugin-ci
        run: |
          composer global require moodlehq/moodle-plugin-ci
          echo "$HOME/.composer/vendor/bin" >> $GITHUB_PATH

      - name: Ejecutar phpcs
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Ejecutar phpunit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Verificar nombre de la rama del PR
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          REGEX="^(feat|fix|docs|test|chore|refactor|security|data)/[a-z0-9._-]+$"
          if [[ ! "$HEAD_REF" =~ $REGEX ]]; then
            echo "❌ ERROR: El nombre de la rama no cumple con las convenciones del proyecto."
            echo ""
            echo "El nombre de la rama debe seguir el formato:"
            echo "  tipo/descripcion-corta"
            echo ""
            echo "Donde 'tipo' es uno de:"
            echo "  - feat, fix, docs, test, chore, refactor, security, data"
            echo "Y 'descripcion-corta' solo puede tener minúsculas, números, guiones, puntos y guiones bajos."
            echo ""
            echo "Ejemplos válidos:"
            echo "  - docs/rf-020"
            echo "  - chore/ci-rama"
            echo "  - fix/error-login"
            echo "Nombre de rama recibido: '$HEAD_REF'"
            exit 1
          fi
          echo "✅ Rama tiene un nombre válido: $HEAD_REF"

      - name: Verificar que los PR de trabajo apunten a dev
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" != "dev" ]; then
            echo "❌ ERROR: Los PR de trabajo deben apuntar a 'dev', no a 'main'."
            echo ""
            echo "Detectado:"
            echo "  - Rama base:   $BASE_REF"
            echo "  - Rama origen: $HEAD_REF"
            echo ""
            echo "Cómo corregirlo:"
            echo "  1. Cambia la rama base del PR a 'dev' en GitHub."
            echo "  2. Si necesitas mergear a 'main', hazlo desde 'dev' mediante un PR de release."
            exit 1
          fi
          echo "✅ PR apunta a '$BASE_REF' (correcto)"

      - name: Verificar que el PR modifique un solo archivo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          COUNT=$(printf '%s\n' "$FILES" | grep -c .)

          if [ "$COUNT" -le 1 ]; then
            echo "✅ El PR modifica $COUNT archivo(s)"
            exit 0
          fi

          # Excepción: amd/src + amd/build del mismo módulo
          if [ "$COUNT" -eq 2 ]; then
            SRC=$(printf '%s\n' "$FILES" | grep -E '^src/amd/src/.+\.js$' || true)
            BUILD=$(printf '%s\n' "$FILES" | grep -E '^src/amd/build/.+\.min\.js$' || true)
            if [ -n "$SRC" ] && [ -n "$BUILD" ]; then
              echo "✅ Excepción permitida: cambio en amd/src + amd/build"
              exit 0
            fi
          fi

          echo "❌ ERROR: Este PR modifica $COUNT archivos."
          echo ""
          echo "Cada PR debe modificar un solo archivo (un issue = una rama = un PR)."
          echo "Excepción permitida: un cambio en src/amd/src/*.js acompañado de su build en src/amd/build/*.min.js."
          echo ""
          echo "Archivos detectados:"
          printf '  - %s\n' $FILES
          echo ""
          echo "Cómo corregirlo:"
          echo "  1. Divide los cambios en PRs separados, uno por archivo."
          echo "  2. O vuelve a tu rama y mueve los archivos sobrantes a otra rama."
          exit 1
